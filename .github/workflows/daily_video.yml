name: Daily Video Automation Workflow

on:
  schedule:
    # မြန်မာစံတော်ချိန် နေ့စဉ် မနက် ၃:၀၀ နာရီတွင် ၁ ကြိမ် ပတ်မောင်းမည်
    # (UTC အချိန်အရ ယခင်နေ့ ည ၈:၃၀ နာရီ ဖြစ်ပါသည်)
    - cron: '30 20 * * *'
  workflow_dispatch: # လက်ဖြင့် စမ်းသပ်နှိပ်နိုင်ရန်

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Run Automation Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py
